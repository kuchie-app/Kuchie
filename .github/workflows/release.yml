name: Release

# Pushing a tag such as v1.0.0 builds an unsigned IPA and attaches it to the
# GitHub release for that tag. Re-run it from the Actions tab for an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v1.0.0
        required: true

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check that the tag matches pubspec.yaml
        run: |
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match pubspec version $version" >&2
            exit 1
          fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Read the Flutter version from .fvmrc
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - name: Generate code
        run: tool/bootstrap

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Embeds the OpenJDK runtime that runs Mihon APK extensions on iPhone.
      # Every archive it fetches is pinned by SHA-256.
      - name: Prepare the extension runtime
        run: ios/MihonRuntime/prepare.sh

      - name: Build the app (release, unsigned)
        run: flutter build ios --release --no-codesign

      - name: Verify the extension runtime is in the app
        run: |
          test -f build/ios/iphoneos/Runner.app/Frameworks/OpenJDKRuntime.framework/OpenJDKRuntime
          test -f build/ios/iphoneos/Runner.app/KuchieMihonRuntime/KuchieExtensionRuntime.jar

      - name: Package the IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/Kuchie.app
          (cd dist && zip -qry "Kuchie-$TAG-unsigned.ipa" Payload)
          shasum -a 256 "dist/Kuchie-$TAG-unsigned.ipa" > "dist/Kuchie-$TAG-unsigned.ipa.sha256"

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Kuchie ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" dist/Kuchie-*-unsigned.ipa* --clobber
