name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    # Analysis and Dart tests need no Xcode, so they run on the cheaper Linux runner.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read the Flutter version from .fvmrc
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - name: Generate code
        run: tool/bootstrap

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-ios:
    # Liquid Glass needs the iOS 26 SDK, which ships with Xcode 26.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Read the Flutter version from .fvmrc
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - name: Generate code
        run: tool/bootstrap

      # Recorded on macOS; the Linux job skips them.
      - name: Sync diagram goldens
        run: flutter test test/src/features/sync/presentation/diagram/sync_diagram_golden_test.dart

      - name: Build for the iOS Simulator
        run: flutter build ios --simulator --debug --no-codesign

      - name: Build for iPhone (release, unsigned)
        run: flutter build ios --release --no-codesign
